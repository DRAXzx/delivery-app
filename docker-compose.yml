
services:

  email-db:
    image: postgres:16
    environment:
      POSTGRES_DB: email_db
      POSTGRES_USER: email_user
      POSTGRES_PASSWORD: email_pass
    ports:
      - "5433:5432"
    volumes:
      - email_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_user -d email_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  email-ms:
    build: .
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://email-db:5432/email_db
      DB_USER: email_user
      DB_PASSWORD: email_pass
      KAFKA_SERVERS: kafka:19092
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    depends_on:
      email-db:
        condition: service_healthy
      kafka:
        condition: service_started
      mailhog:
        condition: service_started
    restart: on-failure

  seller-ms:
    build: ./seller-ms
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      KAFKA_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_started
    restart: on-failure

  customer-ms:
    build: ./customer-ms
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SELLER_URL: http://seller-ms:8082
    depends_on:
      seller-ms:
        condition: service_started
    restart: on-failure

volumes:
  email_data:
