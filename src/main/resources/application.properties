
spring.application.name=email-ms
server.port=${SERVER_PORT:8083}

# BANCO DE DADOS
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/email_db}
spring.datasource.username=${DB_USER:email_user}
spring.datasource.password=${DB_PASSWORD:email_pass}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true

# APACHE KAFKA
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=email-ms-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.deliveryapp.emailms.dto.OrderNotificationDTO
spring.kafka.consumer.properties.spring.json.trusted.packages=com.deliveryapp.emailms.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.missing-topics-fatal=false

# SERVIDOR DE EMAIL
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=delivery-app@email.com
